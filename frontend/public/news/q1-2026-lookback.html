<style>
/* ═══ DESIGN TOKENS ═══════════════════════════════════════════════ */
:root {
  --cyan: #22d3ee;
  --cyan-dim: rgba(34,211,238,.12);
  --cyan-border: rgba(34,211,238,.28);
  --gold: #f59e0b;
  --gold-dim: rgba(245,158,11,.12);
  --gold-border: rgba(245,158,11,.28);
  --green: #4ade80;
  --green-dim: rgba(74,222,128,.12);
  --green-border: rgba(74,222,128,.28);
}

/* ─── DARK MODE ─── */
[data-theme="dark"] {
  --bg: #070d1a;
  --surface: #0c1526;
  --surface2: #111f3a;
  --border: rgba(255,255,255,.07);
  --border-hover: rgba(255,255,255,.14);
  --text: rgba(255,255,255,.92);
  --text-dim: rgba(255,255,255,.58);
  --text-muted: rgba(255,255,255,.3);
  --month-line: rgba(56,189,248,.1);
  --dot-glow: 0 0 8px;
}

/* ─── LIGHT MODE ─── */
[data-theme="light"] {
  --bg: #f0f4ff;
  --surface: #ffffff;
  --surface2: #e4eaf7;
  --border: rgba(0,0,0,.08);
  --border-hover: rgba(0,0,0,.18);
  --text: #0f172a;
  --text-dim: #475569;
  --text-muted: #94a3b8;
  --month-line: rgba(34,211,238,.3);
  --dot-glow: 0 0 6px;
}

/* ═══ RESET ════════════════════════════════════════════════════════ */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background .3s, color .3s;
}

/* ═══ STICKY HEADER ════════════════════════════════════════════════ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  padding: 14px 24px 10px;
}

.header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.header-brand { flex: 1; min-width: 0; }

.site-label {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 2px;
}

.site-title {
  font-size: clamp(17px, 2.5vw, 24px);
  font-weight: 900;
  letter-spacing: -.02em;
  line-height: 1.1;
}

.site-subtitle {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 3px;
  font-weight: 400;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  padding-top: 2px;
}

.theme-toggle {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .2s;
  flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--cyan); color: var(--cyan); }

/* ─── FILTERS ─── */
.filters {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-btn {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 11px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
  transition: .2s;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.filter-btn:hover { border-color: var(--border-hover); color: var(--text-dim); }

/* Active states per type */
.filter-btn.active                          { color: var(--text); border-color: var(--border-hover); background: var(--surface2); }
.filter-btn[data-type="model"].active       { background: var(--cyan-dim); border-color: var(--cyan-border); color: var(--cyan); }
.filter-btn[data-type="company"].active     { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); }
.filter-btn[data-type="opensource"].active  { background: var(--green-dim); border-color: var(--green-border); color: var(--green); }

.cnt {
  font-size: 9px;
  font-weight: 800;
  padding: 1px 5px;
  border-radius: 8px;
  background: var(--surface2);
  color: var(--text-muted);
}

/* ═══ MAIN LAYOUT ══════════════════════════════════════════════════ */
.timeline-wrap {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 20px 80px;
}

/* ═══ QUARTER BANNER ═══════════════════════════════════════════════ */
.quarter-banner {
  text-align: center;
  padding: 36px 20px 28px;
  position: relative;
}
.quarter-banner::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 1px;
  height: 28px;
  background: linear-gradient(to bottom, var(--cyan-border), transparent);
}
.q-eyebrow {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 8px;
}
.q-title {
  font-size: clamp(24px, 5vw, 42px);
  font-weight: 900;
  letter-spacing: -.025em;
  line-height: 1.05;
}
.q-desc {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 8px;
  font-family: 'IBM Plex Mono', monospace;
}

/* ═══ MONTH SECTION ════════════════════════════════════════════════ */
.month-section { margin-bottom: 4px; }

.month-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 22px 0 10px;
}
.month-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
}
.month-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}
.month-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  color: var(--text-muted);
  white-space: nowrap;
}

/* ═══ EVENT ITEM ═══════════════════════════════════════════════════ */
.event-list { display: flex; flex-direction: column; gap: 3px; }

.event-item {
  --accent:        var(--cyan);
  --accent-dim:    var(--cyan-dim);
  --accent-border: var(--cyan-border);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color .18s, background .18s;
}
.event-item.type-company   { --accent: var(--gold);  --accent-dim: var(--gold-dim);  --accent-border: var(--gold-border); }
.event-item.type-opensource { --accent: var(--green); --accent-dim: var(--green-dim); --accent-border: var(--green-border); }

.event-item:hover { border-color: var(--accent-border); background: var(--accent-dim); }
.event-item.open  { border-color: var(--accent-border); background: var(--accent-dim); }
.event-item[data-hidden="true"] { display: none; }

/* ─── EVENT ROW ─── */
.event-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  user-select: none;
}

.event-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  box-shadow: var(--dot-glow) var(--accent);
  transition: box-shadow .2s;
}
.event-item.open .event-dot { box-shadow: 0 0 14px var(--accent); }

.event-date {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
  min-width: 42px;
}

.event-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  flex: 1;
  line-height: 1.3;
  transition: color .18s;
}
.event-item:hover .event-title,
.event-item.open  .event-title { color: var(--accent); }

.type-badge {
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--accent-border);
  background: var(--accent-dim);
  color: var(--accent);
  white-space: nowrap;
  flex-shrink: 0;
  display: none; /* hidden on mobile, shown on wider screens */
}

.chevron {
  font-size: 9px;
  color: var(--text-muted);
  flex-shrink: 0;
  transition: transform .22s, color .18s;
}
.event-item.open .chevron { transform: rotate(90deg); color: var(--accent); }

/* ─── EXPANDED BODY ─── */
.event-body {
  display: none;
  padding: 2px 14px 14px 33px;
}
.event-item.open .event-body { display: block; }

.event-body-inner {
  border-top: 1px solid var(--border);
  padding-top: 12px;
}

.event-desc {
  font-size: 12.5px;
  color: var(--text-dim);
  line-height: 1.72;
  margin-bottom: 12px;
}

.source-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  text-decoration: none;
  padding: 5px 12px;
  border: 1px solid var(--accent-border);
  border-radius: 6px;
  background: var(--accent-dim);
  transition: .2s;
}
.source-link:hover { background: var(--accent); color: var(--bg); }

.no-source {
  font-size: 11px;
  color: var(--text-muted);
  font-style: italic;
}

/* ═══ EMPTY STATE ══════════════════════════════════════════════════ */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-muted);
  font-size: 13px;
  display: none;
}
.empty-state.visible { display: block; }

/* ═══ FOOTER ═══════════════════════════════════════════════════════ */
.site-footer {
  text-align: center;
  padding: 28px 24px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: .06em;
}
.site-footer span { color: var(--cyan); }

/* ═══ RESPONSIVE ═══════════════════════════════════════════════════ */
@media (min-width: 560px) {
  .type-badge { display: inline-block; }
  .event-title { font-size: 13.5px; }
}
</style>
</head>

//  RUNTIME — no edits needed below
// ════════════════════════════════════════════════════════════════════

const TYPE_CONFIG = {
  model:      { label: "Model & Feature", icon: "⚡" },
  company:    { label: "Company News",    icon: "🏢" },
  opensource: { label: "Open Source",     icon: "🔓" }
};

// ─── THEME TOGGLE ──────────────────────────────────────────────────
const htmlEl = document.documentElement;
const themeBtn = document.getElementById('themeToggle');
themeBtn.addEventListener('click', () => {
  const dark = htmlEl.dataset.theme === 'dark';
  htmlEl.dataset.theme = dark ? 'light' : 'dark';
  themeBtn.textContent = dark ? '☀️' : '🌙';
});

// ─── HELPERS ───────────────────────────────────────────────────────
function monthName(dateStr) {
  return new Date(dateStr + 'T12:00:00').toLocaleString('en-US', { month: 'long' }).toUpperCase();
}
function displayDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return (d.getMonth() + 1) + '/' + String(d.getDate()).padStart(2, '0');
}

// ─── BUILD ─────────────────────────────────────────────────────────
function buildTimeline() {
  const sorted = [...EVENTS].sort((a, b) => a.date.localeCompare(b.date));

  // Count by type
  const counts = { model: 0, company: 0, opensource: 0 };
  sorted.forEach(e => counts[e.type]++);

  // Update header badges
  document.getElementById('cnt-all').textContent = sorted.length;
  document.getElementById('cnt-model').textContent = counts.model;
  document.getElementById('cnt-company').textContent = counts.company;
  document.getElementById('cnt-opensource').textContent = counts.opensource;
  document.getElementById('qDesc').textContent =
    `January → March 2026 · ${sorted.length} events`;

  // Group by month
  const byMonth = {};
  sorted.forEach(ev => {
    const m = monthName(ev.date);
    if (!byMonth[m]) byMonth[m] = [];
    byMonth[m].push(ev);
  });

  const container = document.getElementById('timelineContent');
  container.innerHTML = '';

  Object.entries(byMonth).forEach(([month, events]) => {
    const section = document.createElement('div');
    section.className = 'month-section';

    const header = document.createElement('div');
    header.className = 'month-header';
    header.innerHTML = `
      <div class="month-label">${month}</div>
      <div class="month-line"></div>
      <div class="month-count">${events.length} EVENT${events.length !== 1 ? 'S' : ''}</div>
    `;
    section.appendChild(header);

    const list = document.createElement('div');
    list.className = 'event-list';

    events.forEach(ev => {
      const tc = TYPE_CONFIG[ev.type];
      const item = document.createElement('div');
      item.className = `event-item type-${ev.type}`;
      item.dataset.type = ev.type;

      const sourceHtml = ev.url
        ? `<a class="source-link" href="${ev.url}" target="_blank" rel="noopener noreferrer">→ ${ev.source || 'Source'} ↗</a>`
        : `<span class="no-source">Source not yet linked</span>`;

      item.innerHTML = `
        <div class="event-header">
          <div class="event-dot"></div>
          <div class="event-date">${displayDate(ev.date)}</div>
          <div class="event-title">${ev.title}</div>
          <div class="type-badge">${tc.icon} ${tc.label}</div>
          <div class="chevron">▶</div>
        </div>
        <div class="event-body">
          <div class="event-body-inner">
            <p class="event-desc">${ev.desc}</p>
            ${sourceHtml}
          </div>
        </div>
      `;

      item.querySelector('.event-header').addEventListener('click', () => {
        const isOpen = item.classList.contains('open');
        document.querySelectorAll('.event-item.open').forEach(el => el.classList.remove('open'));
        if (!isOpen) item.classList.add('open');
      });

      list.appendChild(item);
    });

    section.appendChild(list);
    container.appendChild(section);
  });
}

// ─── FILTER ────────────────────────────────────────────────────────
let activeFilter = 'all';

document.getElementById('filterBar').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  activeFilter = btn.dataset.type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
});

function applyFilter() {
  let visible = 0;
  document.querySelectorAll('.event-item').forEach(item => {
    const show = activeFilter === 'all' || item.dataset.type === activeFilter;
    item.dataset.hidden = show ? 'false' : 'true';
    if (show) visible++;
  });
  document.querySelectorAll('.month-section').forEach(section => {
    const hasVisible = section.querySelectorAll('.event-item:not([data-hidden="true"])').length > 0;
    section.style.display = hasVisible ? '' : 'none';
  });
  document.getElementById('emptyState').classList.toggle('visible', visible === 0);
}

// ─── INIT ──────────────────────────────────────────────────────────
buildTimeline();
</script>
